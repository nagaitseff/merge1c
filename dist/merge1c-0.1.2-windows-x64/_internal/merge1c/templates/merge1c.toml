# Общие настройки проекта. Файл можно хранить в Git.
# Пути конкретного компьютера удобнее задавать в merge1c.local.toml.
# Текст и пути берутся в кавычки. Списки: ['src/cf', 'src/cfe'].
# В путях Windows используйте C:/Temp или одинарные кавычки 'C:\Temp'.

# Версия формата настроек, а не версия программы. Сейчас поддерживается 1.
schema_version = 1

[project]
# Где искать XML/BSL для специального объединения и проверки.
# Пути относительно корня репозитория, например ['src/cf', 'src/cfe'].
# [] означает всё дерево. Остальные файлы тоже сохраняются в кандидате.
source_roots = []
# Точная версия 1С, которую должен подтвердить внешний проверяющий адаптер.
# Это не путь к установленной платформе и не автоматическая её установка.
platform_version = '8.3.27.2342'

[storage]
# Родительский каталог для новых сессий, когда не указан --session.
# Пустая строка: временный каталог пользователя + папка merge1c-sessions.
# Примеры: 'C:/Temp/merge-sessions' или 'C:/REP/merge-sessions'.
# Выберите место, где разрешены создание, запись, переименование и удаление.
# Сессии должны быть вне исходного репозитория. Временные файлы также
# создаются рядом с сессией. --session задаёт другой путь для одного запуска.
# Относительный путь считается от каталога этого файла; переменные не подставляются.
session_root = ''

[git]
# Имя Git в PATH или полный путь к git.exe; локально можно переопределить.
executable = 'git'
# Минимальная версия Git для всех операций. Ниже 2.50 не поддерживается.
minimum_version = '2.50.0'
# Сопоставление объектов по контейнеру, виду и UUID, а не похожести строк XML.
# В текущей версии доступно только 'domain'.
rename_detection = 'domain'

[xml.forms]
# Сохранять исходные байты вне принятых изменений. Сейчас только true.
preserve_source = true
# В прежнем промежутке новые элементы поставщика идут выше наших добавлений.
# В текущей версии доступна только указанная политика размещения.
placement = 'after_incoming_in_same_gap'
# Сохранять свободные ID, переназначать только коллизии наших добавлений.
# Известные ссылки согласуются; неизвестные требуют ручного решения.
id_policy = 'preserve_and_remap_collisions'

[bsl]
# Независимые изменения разных методов объединяются. Спорный метод — вручную.
# Сейчас доступен только режим 'conservative'.
mode = 'conservative'
# Переносить исходные фрагменты без форматирования всего модуля. Только true.
preserve_source = true

[resolution]
# Не угадывать неоднозначное решение. Сейчас доступно только 'manual'.
ambiguous = 'manual'
# Имя инструмента из [tools.<имя>] для resolve --tool без явного имени.
# Пустая строка отключает выбор по умолчанию; инструмент можно указать явно.
manual_tool = 'beyond_compare'

[tools.beyond_compare]
# Как запускать программу: command, beyond_compare или platform.
# beyond_compare с пустым args сам передаёт /solo /ro и четыре пути файлов.
adapter = 'beyond_compare'
# Путь к программе. Задайте его в локальном файле; пустой путь не запускается.
executable = ''
# resolver готовит решение файла; validator проверяет готовый кандидат.
kind = 'resolver'
# По одному аргументу в строке списка, без добавочных кавычек для пробелов.
# Подстановки: {base}, {local}, {incoming}, {result}, {candidate}, {report},
# {path}, {project}. Непустой args заменяет стандартные аргументы адаптера.
args = []
# Максимальное ожидание в секундах. Здесь 2 часа на ручную работу.
timeout = 7200
# Нужен ли JSON-отчёт от программы. Для Beyond Compare — false.
# Адаптер platform должен возвращать отчёт с версией платформы.
report_required = false

[validation]
# true: для готовности требуется реально выполненная проверка 1С
# настроенным адаптером platform. Без него слияние подготовится,
# но check не подтвердит готовность к созданию ветки.
# false — осознанное статическое ревью без подтверждения платформы.
require_platform = true
# Имена дополнительных обязательных инструментов с kind = 'validator'.
# Они должны быть объявлены в [tools.<имя>]. [] — дополнительных проверок нет.
# Пример: ['bsl_check']. Это не отменяет require_platform.
required_tools = []

[profiles.vendor_update]
# Роль входящей ветки в отчёте: поставщик. Не означает «принять всё типовое».
# Профиль выбирается через --profile vendor_update и используется по умолчанию.
incoming_role = 'vendor'

[profiles.develop_sync]
# Для обновления develop из master выбирайте --profile develop_sync.
# Значение master — роль входящей стороны, а не команда переключения ветки.
incoming_role = 'master'
