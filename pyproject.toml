[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merge1c"
version = "0.1.1"
description = "Three-way integration of 1C Designer XML and BSL sources"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "merge1c contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[project.scripts]
merge1c = "merge1c.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merge1c = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/benchmark.py" = ["E402"]

